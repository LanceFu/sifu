# Sifu configuration. Model names are looked up here, never hard-coded in agents.
# Confirm Ollama tags with `ollama list` before running (tags confirmed against ollama list on 2026-10-30).

ollama:
  base_url: http://localhost:11434
  num_ctx: 65536            # Claude Code needs 64K+ when the implementer runs locally

models:
  author: "qwen3.8:27b"           # intent / spec / plan modes
  spec_reviewer: "qwen3.8:27b"
  code_reviewer: "gemma4:31b-mlx"     # different family from the author (separation of duties)
  risk_assessors:                 # two families so agreement is a real signal
    - "qwen3.8:27b"
    - "gemma4:31b-mlx"

implementer:
  backend: cloud            # cloud | ollama. Override once with SIFU_IMPLEMENTER_BACKEND=ollama
  cloud_model: null         # null: the Claude Code default
  ollama_model: "qwen3-coder:30b"
  max_turns: 30
  timeout_seconds: 1800
  allowed_tools:
    - Read
    - Edit
    - Write
    - Glob
    - Grep
    - "Bash(swift build:*)"
    - "Bash(swift test:*)"
    - "Bash(git status:*)"
    - "Bash(git diff:*)"
    - "Bash(git add:*)"
    - "Bash(git commit:*)"

planner:
  enabled: false            # true: write plan.md after the spec is accepted and gate Build on it
  listing_cap: 150
  excerpt_chars: 3000
  total_chars: 15000

verify:                     # run by Sifu itself after every implementer run, cheapest first
  timeout_seconds: 900
  max_findings: 20          # findings sent back to the implementer per round
  extra_allowed_paths:      # files the implementer may add even when the spec does not list them
    - "Tests/"
  steps:
    - name: build
      command: ["swift", "build", "-Xswiftc", "-warnings-as-errors"]
      parser: compiler
    - name: swiftlint
      command: ["swiftlint", "lint", "--strict", "--reporter", "json"]
      parser: swiftlint_json
    - name: test
      command: ["swift", "test"]
      parser: compiler

router:
  merge_mode: risk_based    # manual | risk_based | auto (floor rules apply in every mode)
  max_build_iterations: 3
  max_design_rounds: 3          # clarification loops in the Design stage before the ticket fails
  max_tokens_per_ticket: 400000 # model tokens (prompt + completion) per ticket before it fails
  protected_paths:          # a trailing slash means "everything under this directory"
    - ".github/"
    - ".claude/"
    - ".swiftlint.yml"
    - "conventions.md"
    - "docs/glossary.yaml"
    - "Package.swift"

github:
  repo: "LanceFu/tripplanner-ios"
  token_env: SIFU_GITHUB_TOKEN         # optional override, checked first
  keychain_service: sifu-github-token  # macOS Keychain item used when the env var is unset
  base_branch: main
  required_check: test      # the Actions check Sifu waits for before the merge decision
  ci_timeout_seconds: 600
  ci_poll_seconds: 15
  merge_method: squash      # squash | merge | rebase
  commit_name: Sifu
  commit_email: sifu@users.noreply.github.com

workspace:
  product_repo_path: "~/Development/AgenticAI/tripplanner-ios"
  worktrees_dir: "~/Development/AgenticAI/worktrees"

database:
  path: data/sifu.db
