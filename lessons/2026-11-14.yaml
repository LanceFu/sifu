# Lessons proposed for tripplanner-ios conventions.md, each from a failure seen in a real run.
# Evidence is a block scalar (>-), so a "#" in it is text, not a comment.
- lesson: >-
    When a change makes an existing initializer or method throw, update every caller in the same
    change, tests included, so the test target still compiles.
  evidence: >-
    Nov 14 verify pass on the critic golden set: 5 of 10 patches made Stop.init or DayPlan.add
    throw without updating DayPlanTests.swift and TripTests.swift, so swift test failed to compile
    ('call can throw but is not marked with try').
- lesson: >-
    No force casts (`as!`); use `as?` with a guard that throws a case of the typed Error enum.
  evidence: >-
    PR #4 (Sifu ticket 1): SwiftLint force_cast at Sources/TripPlannerCore/DayPlan.swift:39 was
    still unresolved after 3 build rounds, so the loop stopped at its cap and opened a draft PR.
    The violation was planted to test the loop, but the implementer never removed it.
- lesson: >-
    Change only the files the spec lists, plus tests under Tests/; ask before touching anything
    else.
  evidence: >-
    PR #3 (Sifu ticket 1) took three verify rounds because the implementer changed a file outside
    the spec, which the diff check flagged before the planted SwiftLint violation.
